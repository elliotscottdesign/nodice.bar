name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 is the current active LTS. Bumped from 20 on
          # 2026-07-02 after GitHub warned Node 20 is deprecated in
          # the internal actions runtime (actions/checkout, setup-node,
          # deploy-pages all target Node 24 now). Building on 22 keeps
          # us aligned with GitHub's runtime and silences the warning.
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        env:
          # NOTE — June 2026: the site moved off the /nodice.bar/ subpath
          # onto the custom domain root (https://nodice.bar/). The basePath
          # env vars are intentionally left UNSET now so Next builds with
          # an empty prefix. Setting GITHUB_PAGES / NEXT_PUBLIC_BASE_PATH
          # again would re-break every asset URL (404s like
          # nodice.bar/nodice.bar/_next/…).
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_BASE_PATH: ""
          # Supabase — anon public key is designed to be embedded in
          # browser code; safe to keep inline. The real protection is the
          # Row-Level Security policies on the database, not this key.
          # If the project URL or key ever change, update both places
          # (this file AND .env.local on the founder's laptop).
          NEXT_PUBLIC_SUPABASE_URL: "https://rntcujcpsozvuxvmlejv.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJudGN1amNwc296dnV4dm1sZWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Nzk0MDIsImV4cCI6MjA5NjA1NTQwMn0.cUMy2GWme7quwDKns_sXq8OY-9SqWaIuZqhYSz3ZwrY"
          # Stripe — publishable key is designed to be embedded in the
          # browser; safe to keep inline. The secret key NEVER goes here
          # — it lives only in Supabase Edge Function env vars (set via
          # Supabase Dashboard → Project Settings → Edge Functions →
          # Manage secrets → STRIPE_SECRET_KEY).
          # LIVE key (pk_live_...). Real money flows through every
          # Stripe Checkout session this app creates. To roll back to
          # test mode (e.g. for a UAT or dry-run), swap for the
          # pk_test_... key from the same Stripe dashboard.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_live_51TfSToEddxnQskbUXZsHbuesoRp150bJdW2jFjJM1w31Tu5ZMDgg7cQMOXz4crIGUHSQerwNmS5VIOlDmtJyHBFp00PvhA3Q2n"
        run: npm run build

      - name: Disable Jekyll on output (lets _next/ folder serve)
        run: touch out/.nojekyll

      # `enablement: true` tells the action to switch GitHub Pages ON
      # for this repo if it isn't already. Saves a manual click in
      # Settings → Pages on first deploy of a fresh repo. Requires the
      # repo to be public (free tier) or the org to have Pages on
      # private repos enabled (Pro/Enterprise).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
